name: Refresh catalog

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-translation.txt
      - uses: actions/cache@v4
        with:
          path: .translation-models
          key: argos-it-en-1_0-en-ru-1_9
      - run: python -m pip install -r requirements-translation.txt
      - run: python sync_catalog.py
      - run: python refresh_translations.py
      - run: python build_taxonomy.py
      - run: python refresh_attributes.py --limit 750 --max-seconds 600
      - name: Commit updated catalog
        run: |
          git add meta.json products.json coop-images.json lidl-products.json eurospin-products.json catalog-taxonomy.json product-attributes.json product-info-index.json data/product-info translations-ru.json sync-status.json assets/atlases
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update product catalog"
          git push
